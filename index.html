<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusList: a to-do list painted in ink</title>
    <meta
      name="description"
      content="FocusList is a fast, frontend-only to-do app with priorities, search, filters and live statistics, set against a Japanese ukiyo-e painting."
    />
    <meta name="theme-color" content="#eee9dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="FocusList" />
    <meta property="og:description" content="A to-do list painted in ink. Tasks, priorities, search, filters and statistics that stay in your browser." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('focuslist:theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: a to-do list that lives in front of a real ukiyo-e print; every action answers back with a small, quick gesture of ink.
      OWN-WORLD: a papyrus panel beside a public-domain Met print per page (Hokusai, Kuniyoshi, Hiroshige), sumi ink, vermilion seals, indigo Medium; Shippori Mincho display, Zen Kaku Gothic UI, Yuji Syuku kanji seals; 2px corners; ink blooms, stamps and washes as motion.
      STORY: the visitor sees tasks at once, acts by mouse, touch or keyboard, and every click is acknowledged in under 300 ms without ever making them wait.
      FIRST VIEWPORT: the print fills the left of the screen, the papyrus panel on the right holds wordmark, nav, title with live stats, add form, filters and the list; on a phone the print is a band above the panel.
      FORM: printmaker's studio, motion tokens in CSS, one --motion-scale to tune pace.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
